// ============================================================
// YouTube Premium 极简按钮页 —— Quantumult X 版
// ============================================================
// 作用：把 App 内 YouTube Premium 页（含错误页）无条件替换为
//       两个裸按钮「个人试用 / 家庭试用」，点按走真实购买命令。
//
// 用法：把下面 [rewrite_local] 那行复制到你的 QX 配置文件对应段落。
//       脚本地址用你自己的仓库 raw 地址（下面已按本仓库填好）。
//
// 依赖：QX 需开启 MITM 并信任证书；hostname 里要有
//       youtubei.googleapis.com
// ============================================================

[rewrite_local]
^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/browse url script-response-body https://raw.githubusercontent.com/kidrauhl123/JungRules/main/quantumult/scripts/yt_trial.js

[mitm]
hostname = youtubei.googleapis.com
